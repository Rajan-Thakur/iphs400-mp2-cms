{% extends "base.html" %}
{% block content %}
  <div class="hero">
    <h1>{{ title }}</h1>
    <p class="lede">The latest posts.</p>
  </div>
  {% if items %}
    <ul class="post-feed">
      {% for item in items %}
        <li><a class="post-card" href="{{ item.href }}"><span class="post-card__title">{{ item.title }}</span>{% if item.date %}<span class="post-card__date">{{ item.date }}</span>{% endif %}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">Nothing published yet.</p>
  {% endif %}
{% endblock %}
