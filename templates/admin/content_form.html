{% extends "admin/base.html" %}
{% block admin_content %}
  <h1>{{ title }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post"
        action="{{ to_root }}{{ link_prefix }}/{{ item['id'] ~ '/edit' if item else 'new' }}"
        class="content-form" id="content-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Title
      <input type="text" name="title" value="{{ form_title }}" required>
    </label>
    <label>Slug
      <input type="text" name="slug" value="{{ form_slug }}" required>
    </label>
    <label>Body (Markdown)
      <textarea id="body_md" name="body_md" rows="12">{{ form_body_md }}</textarea>
    </label>
    <button type="submit">Save</button>
  </form>
  <section class="content-preview">
    <h2>Preview</h2>
    <div id="preview" class="content-preview__body">{{ preview_html | safe }}</div>
  </section>
  <script>
    (function () {
      var textarea = document.getElementById("body_md");
      var preview = document.getElementById("preview");
      var timer = null;
      textarea.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          var body = new URLSearchParams();
          body.set("body_md", textarea.value);
          fetch("{{ to_root }}{{ link_prefix }}/preview", { method: "POST", body: body })
            .then(function (response) {
              // An expired session redirects to /login; don't paste that page in.
              if (!response.ok || response.redirected) { throw new Error("preview failed"); }
              return response.text();
            })
            .then(function (html) { preview.innerHTML = html; })
            .catch(function () {
              preview.textContent = "Preview unavailable — your session may have expired. " +
                "Save your text elsewhere, reload the page, and log in again.";
            });
        }, 300);
      });
    })();
  </script>
{% endblock %}
