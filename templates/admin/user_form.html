{% extends "admin/base.html" %}
{% block admin_content %}
  <div class="page-head">
    <h1>New user</h1>
    <a class="button button--secondary" href="{{ to_root }}admin/users">Back to users</a>
  </div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ to_root }}admin/users/new" class="content-form card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email
      <input type="email" name="email" value="{{ form_email }}" required>
    </label>
    <label>Initial password
      <input type="password" name="password" required>
    </label>
    <label>Role
      <select name="role">
        <option value="editor" {% if form_role == "editor" %}selected{% endif %}>editor</option>
        <option value="admin" {% if form_role == "admin" %}selected{% endif %}>admin</option>
      </select>
    </label>
    <div class="form-actions">
      <button type="submit">Create user</button>
    </div>
  </form>
{% endblock %}
