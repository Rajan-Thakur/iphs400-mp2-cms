{% extends "admin/base.html" %}
{% block admin_content %}
  <h1>New user</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/users/new" class="content-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email
      <input type="email" name="email" value="{{ form_email }}" required>
    </label>
    <label>Initial password
      <input type="password" name="password" required>
    </label>
    <label>Role
      <select name="role">
        <option value="editor" {% if form_role == "editor" %}selected{% endif %}>editor</option>
        <option value="admin" {% if form_role == "admin" %}selected{% endif %}>admin</option>
      </select>
    </label>
    <button type="submit">Create user</button>
  </form>
{% endblock %}
