{% extends "admin/base.html" %}
{% block admin_content %}
  <h1>{{ title }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post"
        action="{{ '/admin/posts/' ~ post['id'] ~ '/edit' if post else '/admin/posts/new' }}"
        class="post-form" id="post-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Title
      <input type="text" name="title" value="{{ form_title }}" required>
    </label>
    <label>Slug
      <input type="text" name="slug" value="{{ form_slug }}" required>
    </label>
    <label>Body (Markdown)
      <textarea id="body_md" name="body_md" rows="12">{{ form_body_md }}</textarea>
    </label>
    <button type="submit">Save</button>
  </form>
  <section class="post-preview">
    <h2>Preview</h2>
    <div id="preview" class="post-preview__body">{{ preview_html | safe }}</div>
  </section>
  <script>
    (function () {
      var textarea = document.getElementById("body_md");
      var preview = document.getElementById("preview");
      var timer = null;
      textarea.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          var body = new URLSearchParams();
          body.set("body_md", textarea.value);
          fetch("/admin/posts/preview", { method: "POST", body: body })
            .then(function (response) { return response.text(); })
            .then(function (html) { preview.innerHTML = html; });
        }, 300);
      });
    })();
  </script>
{% endblock %}
