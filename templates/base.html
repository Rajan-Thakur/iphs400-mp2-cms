<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{% block css_href %}{{ css_path | default('style.css') }}{% endblock %}">
</head>
<body class="{% block body_class %}site{% endblock %}">
  <header class="topbar">
    <div class="topbar__inner">
      {% block brand %}<a class="brand" href="{{ home_path | default('index.html') }}"><span class="brand__mark" aria-hidden="true">✦</span>{{ site_title | default(title) }}</a>{% endblock %}
      {% block topnav %}
        {% if nav_items %}
          <nav class="site-nav" aria-label="Pages">
            {% for item in nav_items %}<a href="{{ item.href }}">{{ item.title }}</a>{% endfor %}
          </nav>
        {% endif %}
      {% endblock %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
